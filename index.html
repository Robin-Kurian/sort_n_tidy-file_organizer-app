<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Sort N Tidy</title>
</head>

<body>
    <div class="titlebar">
        <h1>Sort N Tidy</h1>
    </div>

    <div class="container">
        <section class="glass-panel folder-section">
            <div id="folderSelectBlock">
                <p class="hint">
                    <span class="iButton" aria-hidden="true">i</span>
                    Select the folder you want to organize.
                </p>
                <button id="selectFolderBtn" type="button">Select Folder</button>
            </div>
            <div class="current-folder" id="currentFolder">Selected folder: …</div>
        </section>

        <section class="glass-panel controls">
            <label class="checkbox-container" for="processExisting">
                <input type="checkbox" id="processExisting">
                <span>Process existing files</span>
            </label>
            <label class="checkbox-container" for="resortOthers">
                <input type="checkbox" id="resortOthers">
                <span>Re-sort recognized files in Others</span>
            </label>
            <div class="button-row">
                <button id="startBtn" type="button">Start Monitoring</button>
                <button id="stopBtn" class="hidden" type="button">Stop Monitoring</button>
            </div>
        </section>

        <section class="log-section">
            <h3 class="activity-log-header">
                Activity Log
                <button id="clearLogBtn" type="button" title="Clear log" aria-label="Clear log">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <path fill="currentColor" d="M9 3h6l1 2h5v2H3V5h5l1-2zm1 6h2v10h-2V9zm4 0h2v10h-2V9zM6 8h12l-1 13H7L6 8z"/>
                    </svg>
                </button>
            </h3>
            <div class="log-container" id="logContainer"></div>
        </section>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        document.body.classList.add(`platform-${process.platform}`);

        function setCurrentFolder(folderPath) {
            if (!folderPath) return;
            document.getElementById('currentFolder').textContent = `Selected folder: ${folderPath}`;
        }

        async function loadSelectedFolder() {
            const currentPath = await ipcRenderer.invoke('get-selected-folder');
            setCurrentFolder(currentPath);
        }

        document.getElementById('selectFolderBtn').addEventListener('click', async () => {
            document.getElementById('selectFolderBtn').disabled = true;
            document.getElementById('startBtn').disabled = true;
            try {
                const newPath = await ipcRenderer.invoke('select-folder');
                setCurrentFolder(newPath);
            } catch (error) { window.alert(error.message); }
            finally {
                document.getElementById('selectFolderBtn').disabled = false;
                document.getElementById('startBtn').disabled = false;
            }
        });

        function setMonitoring(running) {
            document.getElementById('startBtn').classList.toggle('hidden', running);
            document.getElementById('folderSelectBlock').classList.toggle('hidden', running);
            document.getElementById('stopBtn').classList.toggle('hidden', !running);
            document.getElementById('processExisting').disabled = running;
            document.getElementById('resortOthers').disabled = running;
        }
        async function changeMonitoring(running) {
            const button = document.getElementById(running ? 'startBtn' : 'stopBtn');
            button.disabled = true;
            document.getElementById('selectFolderBtn').disabled = true;
            try {
                const result = await ipcRenderer.invoke(running ? 'start-monitoring' : 'stop-monitoring', {
                    processExisting: document.getElementById('processExisting').checked,
                    resortOthers: document.getElementById('resortOthers').checked
                });
                if (result.ok) setMonitoring(running);
                else window.alert(result.error);
            } catch (error) { window.alert(error.message); }
            finally {
                button.disabled = false;
                document.getElementById('selectFolderBtn').disabled = false;
            }
        }
        document.getElementById('startBtn').addEventListener('click', () => changeMonitoring(true));
        document.getElementById('stopBtn').addEventListener('click', () => changeMonitoring(false));

        document.getElementById('clearLogBtn').addEventListener('click', () => {
            document.getElementById('logContainer').innerHTML = '';
        });

        ipcRenderer.on('folder-path', (event, folderPath) => {
            setCurrentFolder(folderPath);
        });

        ipcRenderer.on('log', (event, message) => {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            while (logContainer.childElementCount > 500) {
                logContainer.firstElementChild.remove();
            }
        });

        loadSelectedFolder();
    </script>
</body>

</html>
