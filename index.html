<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>File Organizer</title>
</head>

<body>
    <div class="container">
        <div class="folder-section">
            <div id="folderSelectBlock">
                <p><span class="iButton">i</span> Select the folder you want to Organize.</p>
                <button id="selectFolderBtn">Select Folder</button>
            </div>
            <div class="current-folder" id="currentFolder">
                Selected folder: Downloads
            </div>
        </div>

        <div class="controls">
            <div class="checkbox-container">
                <input type="checkbox" id="processExisting">
                <label for="processExisting">Process existing files</label>
            </div>
            <button id="startBtn">Start Monitoring</button>
            <button id="stopBtn" class="hidden">Stop Monitoring</button>
        </div>

        <h3 class="activity-log-header">
            Activity Log
            <img id="clearLogBtn" src="recycle-bin.png" alt="Clear Log">
        </h3>
        <div class="log-container" id="logContainer"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        document.getElementById('selectFolderBtn').addEventListener('click', async () => {
            const newPath = await ipcRenderer.invoke('select-folder');
            if (newPath) {
                document.getElementById('currentFolder').textContent = `Current: ${newPath}`;
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            const processExisting = document.getElementById('processExisting').checked;
            ipcRenderer.send('start-monitoring', processExisting);
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('folderSelectBlock').classList.add('hidden');
            document.getElementById('stopBtn').classList.remove('hidden');
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            ipcRenderer.send('stop-monitoring');
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('folderSelectBlock').classList.remove('hidden');
            document.getElementById('startBtn').classList.remove('hidden');
        });

        document.getElementById('clearLogBtn').addEventListener('click', () => {
            document.getElementById('logContainer').innerHTML = '';
        });

        ipcRenderer.on('log', (event, message) => {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        });
    </script>
</body>

</html>
